[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit-build-core.build"

[project]
name = "ode_solver"
version = "0.1.0"
description = "Solucionador de EDOs de alto rendimiento en C++"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "ipywidgets>=8.0.0",
    "notebook>=7.0.0",
]

[tool.scikit-build]
cmake.version = ">=3.15"
ninja.version = ">=1.10"